.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pin{display:flex;gap:8px;margin-top:10px}
.pin input{font:600 22px/1 Oswald,sans-serif;letter-spacing:.3em;text-align:center;max-width:160px}

.ov{position:fixed;inset:0;z-index:20;pointer-events:none;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle,rgba(10,16,14,.62),rgba(10,16,14,.18) 72%);animation:ovin .25s ease-out,ovout .4s ease-in 1.9s forwards}
@keyframes ovin{from{opacity:0}}
@keyframes ovout{to{opacity:0}}
.ov .lab{position:relative;z-index:2;text-align:center;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.65);display:flex;flex-direction:column;align-items:center}
.ov .ovbig{font:700 54px/1 Oswald,sans-serif;font-variant-numeric:tabular-nums;animation:pop .55s cubic-bezier(.2,1.6,.4,1) .15s both}
.ov .ovbig.in{color:#8BEBA6}.ov .ovbig.out{color:#FF9A88}.ov .ovbig.sm{font-size:40px}
.ov .sub{font:500 18px/1.3 Oswald,sans-serif;letter-spacing:.02em;margin-top:10px;max-width:84vw;animation:pop .5s ease-out .3s both}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:none;opacity:1}}
.coin{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFEDB0,#E0A526 55%,#9A6A10);border:2px solid #6B4A0A;display:grid;place-items:center;font:700 21px/1 Oswald,sans-serif;color:#6B4A0A;box-shadow:0 3px 0 #6B4A0A}
.coin.usd{background:radial-gradient(circle at 35% 30%,#DDF7CF,#5DB57F 55%,#2E6B45);border-color:#1F4A2F;color:#1F4A2F;box-shadow:0 3px 0 #1F4A2F}
.ov.out .coin{animation:cout 1.4s cubic-bezier(.3,.6,.4,1) var(--d) both}
.ov.in .coin{animation:cin 1.3s cubic-bezier(.5,0,.6,1.3) var(--d) both}
@keyframes cout{0%{transform:scale(.5);opacity:0}15%{opacity:1}100%{transform:translate(var(--x),-62vh) rotate(var(--r));opacity:0}}
@keyframes cin{0%{transform:translate(var(--x),-62vh) rotate(var(--r));opacity:0}20%{opacity:1}80%{transform:translate(calc(var(--x) * .12),0);opacity:1}100%{transform:scale(.4);opacity:0}}
.ov.fx .coin{width:72px;height:72px;margin:-36px;font-size:34px;top:40%}
.ov.fx .coin.a{animation:sw 1.4s ease-in-out .1s both}
.ov.fx .coin.b{animation:sw2 1.4s ease-in-out .1s both}
@keyframes sw{0%{transform:translate(-90px,0)}50%{transform:translate(0,-80px) scale(1.25)}100%{transform:translate(90px,0)}}
@keyframes sw2{0%{transform:translate(90px,0)}50%{transform:translate(0,80px) scale(1.25)}100%{transform:translate(-90px,0)}}
.ov.fx .lab{margin-top:42vh}
.ov .dbox{display:flex;gap:12px;margin-bottom:18px}
.ov .dbox .die{--ds:66px;animation:tumble .95s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes tumble{0%{transform:translateY(-55vh) rotate(-540deg)}70%{transform:translateY(10px) rotate(12deg)}100%{transform:none}}
.ov .ccov{width:min(80vw,330px);min-height:170px;background:#FFF9EC;color:#2A221C;border:3px solid #2A221C;border-radius:10px;box-shadow:0 8px 0 #2A221C;padding:20px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-shadow:none;animation:flip .75s ease-out both}
.ov .ccov b{font:700 15px/1 Oswald,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#C8372D}
.ov .ccov span{font:600 23px/1.2 Oswald,sans-serif}
@keyframes flip{0%{transform:perspective(700px) rotateY(100deg) scale(.6);opacity:0}100%{transform:none;opacity:1}}
.ov.rate .ovbig:nth-child(2){animation-delay:.35s}
@media (prefers-reduced-motion:reduce){.ov,.ov *{animation-duration:.01s!important;animation-delay:0s!important}.ov .coin{display:none}}
.tkl li{flex-wrap:wrap;align-items:center}
.tkl .tx{flex:1;min-width:60%}
.rx{display:flex;gap:4px;margin-left:auto}
.rxb{appearance:none;border:1px solid rgba(244,236,216,.3);background:transparent;color:var(--on-table);border-radius:999px;padding:3px 7px;font-size:13px;cursor:pointer;min-height:28px}
.rxb.on{background:rgba(215,154,43,.35);border-color:var(--gold)}
.offer{border:2px solid var(--gold);background:color-mix(in srgb,var(--gold) 14%,var(--surface));border-radius:4px;padding:12px;margin-top:10px}
.offer b{font:600 17px/1.2 Oswald,sans-serif}
.ver{font:500 11px/1 Oswald,sans-serif;opacity:.7;margin-left:6px}

function picker(key,list){return `<div class="pick" role="group">${list.map(o=>`<button class="pchip${sel[key]===o.id?' on':''}" data-act="pick" data-k="${key}" data-v="${o.id}" aria-pressed="${sel[key]===o.id}">${o.id==='bank'?'<span class="bankico">₽</span>':spr(o)}<span>${esc(o.name)}</span></button>`).join('')}</div>`}
function renderTicker(){const el=$('#ticker');
  if(view!=='table'||!table){el.innerHTML='';tkKey='';return}
  const list=evs.filter(e=>e.kind!=='join'&&e.kind!=='react').slice(-8).reverse(),top=list[0];
  const key=(top?top.id:'')+'|'+tickOpen+'|'+evs.length+'|'+players().map(p=>p.name).join(',');
  if(key===tkKey)return;tkKey=key;
  const fresh=top&&lastTop&&top.id!==lastTop;lastTop=top?top.id:null;
  el.innerHTML=`<button class="tk${fresh?' fresh':''}" data-act="tick" aria-expanded="${tickOpen}"><span class="dot" aria-hidden="true"></span><span class="txt"><span class="mq">${top?esc(describe(top)):'Событий пока нет. Всё, что происходит за столом, появится здесь у всех.'}</span></span>${top?`<span class="tm">${hm(top.ts)}</span>`:''}</button>${tickOpen&&list.length?`<ul class="tkl">${list.map(e=>`<li><span class="tm">${hm(e.ts)}</span><span class="tx">${esc(describe(e))}</span><span class="rx">${['👍','😮','😂'].map(em=>{const rs=evs.filter(r=>r.kind==='react'&&r.of===e.id&&r.emoji===em),mine=rs.some(r=>r.pid===meId());return `<button class="rxb${mine?' on':''}" data-act="react" data-v="${esc(e.id)}" data-e="${em}" aria-label="Реакция ${em}">${em}${rs.length?' '+rs.length:''}</button>`}).join('')}</span></li>`).join('')}</ul>`:''}`;
  const t=el.querySelector('.txt'),m=el.querySelector('.mq');
  if(t&&m)requestAnimationFrame(()=>{const dist=m.scrollWidth-t.clientWidth;if(dist>4){t.style.setProperty('--dist',(dist+16)+'px');t.style.setProperty('--dur',Math.max(7,(dist+16)/32+4).toFixed(1)+'s');t.classList.add('run')}});
}
function headerRight(){const me=pById(meId());
  const s=online?`<span class="sync${stale||dead?' off':''}"><i></i>${dead?'Нет связи':stale?'Связь не подтверждена':'Синхронизация'}</span>`:'<span class="sync off"><i></i>Только это устройство</span>';
  $('#hright').innerHTML=view==='table'&&table?`<div class="row" style="justify-content:flex-end"><button class="tname" data-act="lobby" aria-label="К списку столов">${esc(table.name)}</button><button class="mechip" data-act="seat" aria-label="Сменить игрока">${me?spr(me)+esc(me.name):'Кто вы?'}</button></div>${s}`:s}

function calcGet(){const s=S(),a=(get.lap?+s.passStart:0)+(get.stock||0)*(+s.stockBonus),parts=[];if(get.lap)parts.push('круг');if(get.stock)parts.push(get.stock>1?`акции ×${get.stock}`:'акция');const n=parts.join(' + ');get.amount=a?String(a):'';get.note=n?n[0].toUpperCase()+n.slice(1):''}
/* ---------- operation animations ---------- */
const animQ=[];let animOn=false;
const reduceMo=matchMedia('(prefers-reduced-motion: reduce)').matches;
function playAnim(o){animQ.push(o);if(animQ.length>4)animQ.splice(0,animQ.length-4);if(!animOn)nextAnim()}
function nextAnim(){const o=animQ.shift();if(!o){animOn=false;return}animOn=true;if(o.type==='in'||o.type==='out')feedback(o.type);
  const el=document.createElement('div');el.className='ov '+o.type;el.setAttribute('aria-hidden','true');el.innerHTML=animHtml(o);document.body.appendChild(el);
  setTimeout(()=>{el.remove();nextAnim()},reduceMo?1100:2300)}
function coins(sym,n){let h='';for(let i=0;i<n;i++)h+=`<span class="coin${sym==='$'?' usd':''}" style="--x:${rint(260)-130}px;--r:${rint(720)-360}deg;--d:${(i*.07).toFixed(2)}s">${sym}</span>`;return h}
function animHtml(o){
  switch(o.type){
    case 'in':return coins('₽',9)+`<div class="lab"><div class="ovbig in">+${rub(o.amount)}</div><div class="sub">${esc(o.sub)}</div></div>`;
    case 'out':return coins('₽',9)+`<div class="lab"><div class="ovbig out">−${rub(o.amount)}</div><div class="sub">${esc(o.sub)}</div></div>`;
    case 'fx':return `<span class="coin a">₽</span><span class="coin b usd">$</span><div class="lab"><div class="ovbig sm">${o.side==='buy'?`+${usd(o.usd)}`:`+${rub(o.rub)}`}</div><div class="sub">${o.side==='buy'?`Куплено ${usd(o.usd)} за ${rub(o.rub)}`:`Продано ${usd(o.usd)} за ${rub(o.rub)}`}</div></div>`;
    case 'dice':return `<div class="lab"><div class="dbox">${o.vals.map((d,i)=>dieHtml(d).replace('class="die"',`class="die" style="animation-delay:${(i*.09).toFixed(2)}s"`)).join('')}</div><div class="ovbig">${o.vals.reduce((a,b)=>a+b,0)}</div></div>`;
    case 'chance':return `<div class="lab"><div class="ccov"><b>Шанс</b><span>${esc(o.text)}</span></div></div>`;
    case 'rate':return `<div class="lab"><div class="ovbig in sm">Купить ${o.buy} ₽</div><div class="ovbig out sm">Продать ${o.sell} ₽</div><div class="sub">Новый курс доллара — биржа открыта</div></div>`;
  }return ''}
function animFor(e,me){if(!me)return;
  if(e.kind==='loan'&&e.pid===me){playAnim({type:'in',amount:e.amount,sub:`Ссуда от банка, вернуть ${rub(e.total)}`});return}
  if(e.kind==='offer'&&e.to===me){toast(`${who(e.pid)} предлагает сделку — откройте «Мой счёт»`);feedback('in');return}
  if(e.kind==='final'){toast('Банк объявил итоги партии');return}
  if(e.kind==='pay'){
    if(e.to===me&&e.from!==me)playAnim({type:'in',amount:e.amount,sub:e.from==='bank'?`От банка${e.note?': '+e.note:''}`:`${who(e.from)} → вам${e.note?', '+e.note:''}`});
    else if(e.from===me)playAnim({type:'out',amount:e.amount,sub:`Вы → ${who(e.to)}${e.note?', '+e.note:''}`});
    return}
}

function vMe(){const me=pById(meId());if(!me)return vSeat();

  ${readOnly?'':`<section class="sheet"><h2>Заплатить</h2><div class="lbl">Кому</div>${picker('payTo',others)}
